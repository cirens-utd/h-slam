[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Chip detected: ESP32-S3, 16MB flash, 8MB octal PSRAM (N16R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1        ; native USB-Serial/JTAG port
  -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial -> USB port
  -DCORE_DEBUG_LEVEL=0        ; keep logs from corrupting the image stream

upload_port = /dev/cu.usbmodem3101
monitor_port = /dev/cu.usbmodem3101
